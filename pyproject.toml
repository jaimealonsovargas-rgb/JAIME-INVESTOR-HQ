[project]
name = "jaime-investor-hq"
version = "0.0.1"
description = "Base local de investigación y paper trading. Fase P0."
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pip-audit==2.10.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
